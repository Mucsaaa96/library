<!DOCTYPE html>
    <html lang="en">
        <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Mucsi's first Library</title>
            <link rel="stylesheet" href="./style.css">
            <script src="./javascript.js" defer></script>
        </head>
        <body>
            <main>
                <ul id="grid-container">
                    <button class="card add-book" command="show-modal" commandfor="add-book">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="grey">
                            <path d="M19,13H13V19H11V13H5V11H11V5H13V11H19V13Z" /></svg>
                            Add new book
                    </button>
                </ul>

                <dialog id="add-book">
                    <form>
                        <div class="form-row">
                            <label for="book-title">Book title:</label>
                            <input type="text" 
                                   id="book-title" 
                                   name="book-title"
                                   required /> 
                        </div>
                        <div class="form-row">
                            <label for="book-author">Book author:</label>
                            <input type="text"
                                   id="book-author"
                                   name="book-author"
                                   required />
                        </div>
                        <div class="form-row">
                            <label for="pages">Page number:</label>
                            <input type="number"
                                   id="pages"
                                   name="pages"
                                   required />
                        </div>
                        <div class="form-row">
                            <input type="radio" id="read" name="read">
                            <label for="read">Read</label>
                            <input type="radio" id="not-read" name="not-read">
                            <label for="not-read">Not read</label>
                        </div>
                    </form>
                    <button commandfor="add-book" command="close">Cancel</button>
                </dialog>
            </main>
            <footer>Background imabe by <a href="https://unsplash.com/@tama66">Peter Herrmann</a>
            on <a href="https://unsplash.com/">Unplash</a>.</footer>
        </body>
    </html>
